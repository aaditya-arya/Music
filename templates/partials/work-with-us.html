<section id="work-with-us" class="aes-careers-invitation">
  <div class="aes-careers-invitation__visual" aria-hidden="true">
    <img class="aes-careers-invitation__photo" src="@@ASSET@@/assets/career_culture.jpg" alt="" loading="lazy" decoding="async" width="1376" height="768" />
    <img class="aes-careers-invitation__watermark" src="@@ASSET@@/assets/aes-watermark.svg" alt="" loading="lazy" decoding="async" width="460" height="460" />
  </div>
  <div class="aes-careers-invitation__inner">
    <div class="aes-careers-invitation__copy">
      <p class="aes-careers-invitation__eyebrow">Careers at AES</p>
      <h2>Work With Us</h2>
      <p>Join our network of inspection engineers, QA/QC specialists and technical auditors.</p>
    </div>
    <div class="aes-careers-invitation__actions">
      <a class="btn-premium-orange aes-careers-invitation__primary" href="@@PAGE:careers@@">View openings</a>
      <button type="button" class="aes-careers-invitation__secondary" onclick="openModal('careersModal')">Send your CV</button>
    </div>
  </div>
</section>
